name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npx --no-install expo install --check
      - run: npx --no-install expo export --platform android --output-dir "${{ runner.temp }}/android-export"
        env:
          EXPO_OFFLINE: '1'
      - run: npm audit --omit=dev
      - run: npm audit
